name: Bench unit tests

on:
  push:
    branches:
      - speed-up-unit-test-bench

jobs:
  bench-forks:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 8
        uses: actions/setup-java@v6.2.0
        with:
          java-version: 8
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.1

      - name: Runner info
        run: |
          nproc
          lscpu | grep -E "Model name|^CPU\(s\)"
          free -g

      - name: Run benchmarks
        run: |
          set -u
          git worktree add -q ../forks dffb19f46
          cat > "$RUNNER_TEMP/forks.gradle" <<'GRADLE'
          gradle.projectsEvaluated {
            def n = Integer.parseInt(System.getProperty('benchForks'))
            allprojects { tasks.matching { it.name == 'test' && it instanceof Test }.configureEach { maxParallelForks = n } }
          }
          GRADLE
          cd ../forks
          ./gradlew check buildSrc:check > "$RUNNER_TEMP/warmup.log" 2>&1
          echo "warm-up exit $?"
          echo "| round | forks | seconds | exit |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for round in 1 2 3; do
            for n in 1 2 3 4; do
              start=$(date +%s)
              ./gradlew check buildSrc:check test --rerun --init-script "$RUNNER_TEMP/forks.gradle" -DbenchForks=$n > "$RUNNER_TEMP/$round-forks-$n.log" 2>&1
              rc=$?
              end=$(date +%s)
              line="| $round | $n | $((end - start)) | $rc |"
              echo "$line"
              echo "$line" >> "$GITHUB_STEP_SUMMARY"
            done
          done

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-forks-logs
          path: ${{ runner.temp }}/*.log
