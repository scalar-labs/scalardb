name: CI for Data Loader CLI

on:
  pull_request:
  workflow_dispatch:

# Falling back to the run ID gives each workflow_dispatch run its own group, so only pull request runs get cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  data_loader_ci:
    name: Build Data Loader CLI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 8
        uses: actions/setup-java@v6.1.0
        with:
          distribution: 'temurin'
          java-version: 8

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: Gradle Data Loader CLI build
        run: ./gradlew :data-loader:cli:build --no-daemon --stacktrace

