name: License Check

on:
  pull_request:
  workflow_dispatch:

# Falling back to the run ID gives each workflow_dispatch run its own group, so only pull request runs get cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  license-check:
    name: License Check
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6.1.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: Execute Gradle 'checkLicense' task
        run: ./gradlew checkLicense

      - name: Show dependencies without allowed license
        if: failure()
        run: cat build/reports/dependency-license/dependencies-without-allowed-license.json
