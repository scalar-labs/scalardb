# Throwaway experiment: time the two slowest Spanner test classes with several thread counts
name: CI for Spanner Adapter
run-name: "Spanner thread tuning experiment"

on:
  workflow_dispatch:
    inputs:
      INT_TEST_JAVA_RUNTIME_VERSION:
        type: string
        default: '8'
      INT_TEST_JAVA_RUNTIME_VENDOR:
        type: string
        default: 'temurin'
      REPORT_ON_SLACK:
        type: boolean
        default: false

jobs:
  spanner-integration-test:
    name: "${{ matrix.test }} threads=${{ matrix.threads }}"
    runs-on: ubuntu-latest
    services:
      spanner-emulator:
        image: gcr.io/cloud-spanner-emulator/emulator:latest
        ports:
          - 9010:9010
          - 9020:9020
    strategy:
      fail-fast: false
      matrix:
        include:
          - { test: JdbcDatabaseMultipleClusteringKeyScanIntegrationTestWithSpanner, threads: 4 }
          - { test: JdbcDatabaseMultipleClusteringKeyScanIntegrationTestWithSpanner, threads: 6 }
          - { test: JdbcDatabaseMultipleClusteringKeyScanIntegrationTestWithSpanner, threads: 8 }
          - { test: JdbcDatabaseMultipleClusteringKeyScanIntegrationTestWithSpanner, threads: 12 }
          - { test: JdbcDatabaseConditionalMutationIntegrationTestWithSpanner, threads: 12 }
          - { test: JdbcDatabaseConditionalMutationIntegrationTestWithSpanner, threads: 18 }
          - { test: JdbcDatabaseConditionalMutationIntegrationTestWithSpanner, threads: 24 }
          - { test: JdbcDatabaseConditionalMutationIntegrationTestWithSpanner, threads: 32 }
    steps:
      - uses: actions/checkout@v7

      - name: Wait for Spanner emulator to be ready
        run: |
          SECONDS=0
          until curl -sf http://localhost:9020/v1/projects/emulator-project/instances > /dev/null 2>&1; do
            if (( SECONDS > 60 )); then exit 1; fi
            sleep 2
          done

      - name: Set up JDK 8
        uses: actions/setup-java@v6.0.1
        with:
          java-version: 8
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: Sample CPU usage in the background
        run: |
          nproc
          nohup bash -c 'while true; do date -u +%T; top -b -n1 | head -15; sleep 60; done' > /tmp/cpu.log 2>&1 &

      - name: Run integration test
        env:
          SPANNER_JDBC_URL: "jdbc:cloudspanner://localhost:9010/projects/emulator-project/instances/test-instance/databases/test-db;autoConfigEmulator=true;dialect=POSTGRESQL"
        run: |
          ./gradlew core:integrationTestJdbc \
            "-Dscalardb.jdbc.url=${SPANNER_JDBC_URL}" "-Dscalardb.jdbc.username=" "-Dscalardb.jdbc.password=" \
            "-Dscalardb.spanner.thread_num=${{ matrix.threads }}" \
            --tests ${{ matrix.test }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: results_${{ matrix.test }}_${{ matrix.threads }}
          path: |
            core/build/test-results/integrationTestJdbc/
            /tmp/cpu.log
