name: Database Update Monitor

on:
  schedule:
    # Every Sunday 17:00 UTC (Monday 02:00 JST)
    - cron: '0 17 * * 0'
  workflow_dispatch:
    inputs:
      database_filter:
        description: 'Run for a specific database ID only (empty = all)'
        type: string
        default: ''
      dry_run:
        description: 'Dry run (no Slack post, no state save, still writes report artifacts)'
        type: boolean
        default: false
  pull_request:
    paths:
      - 'ci/db-update-monitor/**'
      - '.github/workflows/db-update-monitor.yaml'
      # The monitor reads ScalarDB's versions from these; the tests check every pin still resolves.
      - 'build.gradle'
      - 'ci/tests-config.yaml'

permissions:
  contents: read

env:
  # The default branch is protected, so the state lives on its own branch,
  # which holds nothing but last-run.json.
  STATE_BRANCH: db-update-monitor-state

jobs:
  test:
    name: Unit tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # One run per pull request; a new push cancels the outdated run.
    concurrency:
      group: db-update-monitor-test-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ci/db-update-monitor/requirements.txt

      - name: Install dependencies
        run: pip install -r ci/db-update-monitor/requirements.txt

      - name: Run tests
        working-directory: ci/db-update-monitor
        run: pytest

  monitor:
    name: Check database updates
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      # To push the state branch.
      contents: write
    # Never run two monitors at once: both would write the state branch.
    concurrency:
      group: db-update-monitor
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ci/db-update-monitor/requirements.txt

      - name: Install dependencies
        run: pip install -r ci/db-update-monitor/requirements.txt

      - name: Check out state branch
        run: |
          STATE_DIR="$RUNNER_TEMP/db-update-monitor-state"
          echo "STATE_DIR=$STATE_DIR" >> "$GITHUB_ENV"
          if git ls-remote --exit-code --heads origin "$STATE_BRANCH" > /dev/null; then
            git fetch --depth=1 origin "$STATE_BRANCH:$STATE_BRANCH"
            git worktree add "$STATE_DIR" "$STATE_BRANCH"
          else
            # First run: no state yet, so this run is the silent baseline.
            echo "State branch $STATE_BRANCH not found; starting with empty state."
            git worktree add --detach "$STATE_DIR"
            git -C "$STATE_DIR" checkout --orphan "$STATE_BRANCH"
            git -C "$STATE_DIR" rm -rf --quiet .
            cat > "$STATE_DIR/README.md" <<'EOF'
          # Database Update Monitor state

          This branch is written by `.github/workflows/db-update-monitor.yaml`.
          It holds `last-run.json`, the monitor's memory of what was already sent to Slack.
          Do not edit it by hand. Delete the branch to start over with a silent baseline run.
          See `ci/db-update-monitor/README.md` on the default branch.
          EOF
          fi

      - name: Run database update monitor
        id: monitor
        env:
          DATABASE_FILTER: ${{ github.event.inputs.database_filter }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python ci/db-update-monitor/src/main.py \
            --config ci/db-update-monitor/config/monitors.yaml \
            --state "$STATE_DIR/last-run.json" \
            --output-dir ci/db-update-monitor/output \
            --repo-root "${{ github.workspace }}" \
            ${DATABASE_FILTER:+--filter "$DATABASE_FILTER"}

      - name: Upload report artifact
        if: always()
        # act (local testing) sets ACT=true; its artifact server does not support this action version.
        continue-on-error: ${{ env.ACT == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: db-monitor-report
          path: ci/db-update-monitor/output/
          retention-days: 90

      - name: Decide Slack notify
        id: slack
        if: always()
        run: |
          FLAG=false
          if [ -f ci/db-update-monitor/output/notify-slack ]; then
            FLAG=$(cat ci/db-update-monitor/output/notify-slack)
          fi
          echo "has_blocks=${FLAG}" >> "$GITHUB_OUTPUT"

      # Post before saving state: if the post fails, the state is not saved and
      # the next run sends the same updates again instead of losing them.
      - name: Notify Slack
        id: notify
        if: >-
          !cancelled()
          && github.event.inputs.dry_run != 'true'
          && steps.slack.outputs.has_blocks == 'true'
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ secrets.SLACK_SCALARDB_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload-file-path: ci/db-update-monitor/output/slack-payload.json
          # Fail the step when Slack rejects the message, so the state is not saved.
          errors: true

      - name: Save state
        if: >-
          !cancelled()
          && github.event.inputs.dry_run != 'true'
          && steps.monitor.outcome == 'success'
          && (steps.notify.outcome == 'success' || steps.notify.outcome == 'skipped')
        run: |
          cd "$STATE_DIR"
          git add --all
          if git diff --cached --quiet; then
            echo "No state changes"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="github-actions[bot]@users.noreply.github.com" \
              commit --quiet -m "Update database update monitor state (run ${{ github.run_id }})"
          git push origin "HEAD:refs/heads/$STATE_BRANCH"
