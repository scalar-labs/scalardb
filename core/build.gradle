            include '**/com/scalar/db/storage/dynamo/DynamoPermissionTestUtils.java'
            include '**/com/scalar/db/storage/dynamo/DynamoAdminTestUtils.java'
            include '**/com/scalar/db/storage/dynamo/DynamoEnv.java'
